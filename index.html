<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>部首 SNAP</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090f;
  --surface: #12121c;
  --card: #1a1a28;
  --border: #2a2a40;
  --text: #e8e6f4;
  --muted: #5a5870;
  --accent: #c9a84c;
  --accent2: #e8824a;

  --r-ninben: #5b8ff9;
  --r-tehen: #f97b5b;
  --r-gonben: #a57bf9;
  --r-kokoro: #f95b8a;
  --r-sanzui: #5bc8f9;
  --r-itoh: #5bf9c8;

  --correct: #4caf7d;
  --wrong: #f95b5b;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; overflow:hidden; user-select:none; }

/* ── 배경 효과 ── */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(91,143,249,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%, rgba(201,168,76,0.05) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}

.screen { display:none; width:100%; height:100vh; flex-direction:column; position:relative; z-index:1; }
.screen.active { display:flex; }

/* ══════════════════════════════════════
   홈 화면
══════════════════════════════════════ */
#screen-home {
  overflow-y:auto;
  padding-bottom: 32px;
}

.home-hero {
  padding: 56px 24px 24px;
  text-align: center;
  position: relative;
}
.home-logo {
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--muted);
  margin-bottom: 10px;
}
.home-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 3px;
  line-height: 1.1;
}
.home-tagline {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.6;
}
.home-tagline strong { color: var(--accent); }

.home-body {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 440px;
  margin: 0 auto;
  width: 100%;
}

/* 오늘의 미션 카드 */
.mission-card {
  background: linear-gradient(135deg, #15140a 0%, #1a1808 100%);
  border: 1px solid rgba(201,168,76,0.35);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.mission-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
.mission-card:active { border-color: var(--accent); }
.mission-card.done { opacity: 0.5; cursor: default; }
.mission-icon { font-size: 24px; flex-shrink: 0; }
.mission-info { flex: 1; }
.mission-title { font-size: 13px; font-weight: 700; color: var(--accent); }
.mission-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.mission-streak { text-align: center; flex-shrink: 0; }
.mission-streak-num { font-family:'Noto Serif JP',serif; font-size: 20px; font-weight: 700; color: var(--accent); }
.mission-streak-label { font-size: 9px; color: var(--muted); }

/* 오답 복습 */
.review-strip {
  background: var(--card);
  border: 1px solid rgba(249,91,138,0.2);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.review-strip:active { border-color: rgba(249,91,138,0.5); }
.review-strip.empty { opacity: 0.35; cursor: default; }
.review-badge {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(249,91,138,0.12);
  border: 1px solid rgba(249,91,138,0.25);
  color: var(--wrong);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; font-family:'Noto Serif JP',serif;
  flex-shrink: 0;
}
.review-text { flex: 1; }
.review-title { font-size: 13px; font-weight: 700; }
.review-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* 섹션 라벨 */
.section-lbl {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  padding: 4px 2px 0;
}

/* 레벨 카드 */
.level-grid {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.level-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  overflow: hidden;
}
.level-card::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:3px;
  border-radius: 3px 0 0 3px;
}
.level-card:active { background: #1f1f30; }
.lc-num {
  font-family:'Noto Serif JP',serif;
  font-size: 18px; font-weight: 900;
  color: var(--accent); width: 26px; text-align: center; flex-shrink:0;
}
.lc-info { flex: 1; min-width: 0; }
.lc-name { font-size: 14px; font-weight: 700; }
.lc-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.lc-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
}
.badge-free { background: rgba(76,175,125,0.15); color: #4caf7d; border: 1px solid rgba(76,175,125,0.25); }

/* 통계 */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.stat-num {
  font-family:'Noto Serif JP',serif;
  font-size: 18px; font-weight: 700; color: var(--accent);
}
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 사운드 버튼 */
.sound-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  font-family:'Noto Sans KR',sans-serif;
  margin-top: 4px;
  align-self: center;
}

/* ══════════════════════════════════════
   게임 화면
══════════════════════════════════════ */
#screen-game { overflow: hidden; }

.game-header {
  padding: 48px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.g-progress { font-size: 12px; color: var(--muted); }
.g-score {
  font-family:'Noto Serif JP',serif;
  font-size: 22px; font-weight: 700; color: var(--accent);
}
.g-sound {
  background: none; border: none;
  font-size: 18px; cursor: pointer; padding: 0;
}

/* 타이머 */
.timer-wrap { padding: 0 20px; flex-shrink: 0; }
.timer-track {
  height: 3px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.timer-fill {
  height: 100%; background: var(--accent);
  border-radius: 3px;
  transition: width 0.1s linear, background 0.3s;
}
.timer-fill.danger { background: var(--wrong); }

/* 게임 중앙 */
.game-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 20px;
  gap: 20px;
}

/* 핵심 한자 카드 */
.kanji-stage {
  width: 100%;
  max-width: 340px;
}

.radical-hint-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 14px;
}
.radical-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.radical-char-big { font-family:'Noto Serif JP',serif; font-size: 16px; font-weight: 900; }
.radical-hint-text { font-size: 11px; color: var(--muted); }

.kanji-card-main {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.kanji-card-main::before {
  content:'';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.02), transparent 60%);
}

.kanji-display {
  position: relative;
  display: inline-block;
  margin-bottom: 12px;
}
.kanji-char-main {
  font-family:'Noto Serif JP',serif;
  font-size: 88px;
  font-weight: 900;
  line-height: 1;
  color: var(--text);
  position: relative;
  z-index: 1;
}
.radical-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family:'Noto Serif JP',serif;
  font-size: 88px;
  font-weight: 900;
  line-height: 1;
  opacity: 0.35;
  filter: blur(0px);
}

.kanji-word {
  font-family:'Noto Serif JP',serif;
  font-size: 16px;
  color: var(--muted);
  font-weight: 400;
}
.kanji-reading {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  font-family:'Noto Serif JP',serif;
}

/* 4지선다 */
.choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 340px;
}
.choice-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
  font-family:'Noto Sans KR',sans-serif;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.3;
  position: relative;
  overflow: hidden;
}
.choice-btn:active:not(:disabled) {
  background: #22223a;
  border-color: var(--accent);
}
.choice-btn:disabled { cursor: default; }
.choice-btn.correct {
  border-color: var(--correct) !important;
  background: rgba(76,175,125,0.12) !important;
  color: var(--correct) !important;
}
.choice-btn.wrong {
  border-color: var(--wrong) !important;
  background: rgba(249,91,91,0.1) !important;
  color: var(--wrong) !important;
}
.choice-num {
  position: absolute;
  top: 6px; left: 8px;
  font-size: 9px;
  color: var(--muted);
  font-weight: 400;
}

/* 진행 도트 */
.progress-dots {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}
.p-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s;
}
.p-dot.correct { background: var(--correct); }
.p-dot.wrong { background: var(--wrong); }

/* ══════════════════════════════════════
   학습 카드 (정답 후)
══════════════════════════════════════ */
.learn-sheet {
  position: fixed; inset: 0;
  z-index: 150;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.learn-sheet.show { opacity: 1; pointer-events: auto; }
.learn-inner {
  width: 100%;
  border-radius: 24px 24px 0 0;
  padding: 22px 22px 40px;
  transform: translateY(16px);
  transition: transform 0.25s cubic-bezier(.17,.67,.3,1);
}
.learn-sheet.show .learn-inner { transform: translateY(0); }
.learn-inner.ok-bg {
  background: linear-gradient(160deg, #0b1a10 0%, #0f1a12 100%);
  border-top: 2px solid rgba(76,175,125,0.5);
}
.learn-inner.ng-bg {
  background: linear-gradient(160deg, #1a0b10 0%, #1a0f0f 100%);
  border-top: 2px solid rgba(249,91,91,0.5);
}

.learn-verdict {
  font-size: 13px; font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.learn-verdict.ok { color: var(--correct); }
.learn-verdict.ng { color: var(--wrong); }

.learn-main {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
}
.learn-kanji-big {
  font-family:'Noto Serif JP',serif;
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  flex-shrink: 0;
}
.learn-breakdown { flex: 1; }
.learn-eq {
  font-family:'Noto Serif JP',serif;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
}
.learn-meaning-big {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.learn-reading {
  font-family:'Noto Serif JP',serif;
  font-size: 13px;
  color: var(--muted);
}

.learn-radical-hint {
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 12px;
}
.learn-radical-hint strong { color: var(--text); }

.learn-words {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.learn-chip {
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  padding: 4px 10px;
  font-family:'Noto Serif JP',serif;
  font-size: 12px;
  color: var(--accent);
}
.learn-chip span {
  font-family:'Noto Sans KR',sans-serif;
  font-size: 10px;
  color: var(--muted);
  margin-left: 4px;
}

/* ══════════════════════════════════════
   결과 화면
══════════════════════════════════════ */
#screen-result {
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  gap: 0;
  overflow-y: auto;
}
.result-grade {
  font-family:'Noto Serif JP',serif;
  font-size: 80px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.result-sub {
  font-size: 13px; color: var(--muted);
  margin: 8px 0 28px;
}
.result-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  width: 100%; max-width: 340px;
  margin-bottom: 20px;
}
.rs-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 8px;
  text-align: center;
}
.rs-num { font-family:'Noto Serif JP',serif; font-size: 24px; font-weight: 700; }
.rs-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

.result-list {
  width: 100%; max-width: 340px;
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 24px;
  max-height: 220px; overflow-y: auto;
}
.result-row {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.result-row.r-wrong { border-color: rgba(249,91,91,0.3); }
.rr-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
.rr-char {
  font-family:'Noto Serif JP',serif;
  font-size: 24px; font-weight: 700; width: 32px; flex-shrink: 0;
}
.rr-info { flex: 1; }
.rr-meaning { font-size: 13px; font-weight: 700; }
.rr-radical { font-size: 11px; color: var(--muted); margin-top: 2px; }

.btn-row { display: flex; gap: 10px; width: 100%; max-width: 340px; }
.btn {
  flex: 1; padding: 14px;
  border-radius: 12px; border: none;
  font-family:'Noto Sans KR',sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #09090f; }
.btn-primary:hover { background: #d4b55a; }
.btn-secondary {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
}

/* 피드백 오버레이 */
.feedback-ov {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 200;
  opacity: 0; transition: opacity 0.15s;
}
.feedback-ov.show { opacity: 1; }
.feedback-ov .fe { font-size: 72px; }
</style>
</head>
<body>

<!-- ── 홈 ── -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="home-logo">U N O _ D E Y A</div>
    <div class="home-title">部首 SNAP</div>
    <div class="home-tagline">부수를 보고 뜻을 유추하라<br><strong id="word-count">—</strong>개 단어 기반 · N2 실전 훈련</div>
  </div>

  <div class="home-body">

    <div class="mission-card" id="daily-card" onclick="startDaily()">
      <div class="mission-icon">☀️</div>
      <div class="mission-info">
        <div class="mission-title">오늘의 DAILY 5</div>
        <div class="mission-desc" id="daily-desc">매일 새로 출제</div>
      </div>
      <div class="mission-streak">
        <div class="mission-streak-num" id="streak-num">0</div>
        <div class="mission-streak-label">연속</div>
      </div>
    </div>

    <div class="review-strip" id="review-card" onclick="startReview()">
      <div class="review-badge" id="review-count">0</div>
      <div class="review-text">
        <div class="review-title">오답 복습</div>
        <div class="review-sub" id="review-desc">틀린 한자가 없어요</div>
      </div>
      <div style="font-size:14px;color:var(--muted)">→</div>
    </div>

    <div class="section-lbl">LEVELS</div>
    <div class="level-grid" id="level-grid"></div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="stat-best">—</div>
        <div class="stat-lbl">최고기록</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-played">0</div>
        <div class="stat-lbl">총 플레이</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-acc">—</div>
        <div class="stat-lbl">정답률</div>
      </div>
    </div>

    <button class="sound-btn" id="sound-btn-home" onclick="toggleSound()">🔊 SOUND ON</button>

  </div>
</div>

<!-- ── 게임 ── -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <div class="g-progress" id="g-progress">1 / 10</div>
    <div class="g-score" id="g-score">0</div>
    <button class="g-sound" id="sound-btn-game" onclick="toggleSound()">🔊</button>
  </div>

  <div class="timer-wrap">
    <div class="timer-track">
      <div class="timer-fill" id="timer-fill"></div>
    </div>
  </div>

  <div class="game-center">
    <!-- 부수 힌트 -->
    <div class="kanji-stage">
      <div class="radical-hint-bar">
        <div class="radical-pill" id="radical-pill">
          <span class="radical-char-big" id="radical-char">忄</span>
          <span id="radical-name">마음심변</span>
        </div>
        <span class="radical-hint-text" id="radical-meaning-hint">마음·감정과 관련</span>
      </div>

      <div class="kanji-card-main">
        <div class="kanji-display">
          <div class="kanji-char-main" id="kanji-char">悲</div>
        </div>
        <div class="kanji-word" id="kanji-word">悲観</div>
        <div class="kanji-reading" id="kanji-reading">ひかん</div>
      </div>
    </div>

    <!-- 4지선다 -->
    <div class="choices-grid" id="choices-grid"></div>

    <!-- 진행 도트 -->
    <div class="progress-dots" id="progress-dots"></div>
  </div>
</div>

<!-- ── 결과 ── -->
<div id="screen-result" class="screen">
  <div style="font-size:10px;letter-spacing:4px;color:var(--muted);margin-bottom:10px;">RESULT</div>
  <div class="result-grade" id="result-score">0</div>
  <div class="result-sub" id="result-sub">0문제 · 0개 정답</div>
  <div class="result-stats">
    <div class="rs-box">
      <div class="rs-num" id="rs-correct" style="color:var(--correct)">0</div>
      <div class="rs-lbl">정답</div>
    </div>
    <div class="rs-box">

      <div class="rs-lbl">오답</div>
    </div>

      <div class="rs-num" id="rs-combo" style="color:var(--accent)">0</div>

<div class="learn-sheet" id="learn-sheet">
  <div class="learn-inner" id="learn-inner">
    <div class="learn-verdict" id="learn-verdict">◎</div>
    <div class="learn-main">
      <div class="learn-kanji-big" id="learn-kanji"></div>
      <div class="learn-breakdown">
        <div class="learn-eq" id="learn-eq"></div>
        <div class="learn-meaning-big" id="learn-meaning"></div>
        <div class="learn-reading" id="learn-reading"></div>
      </div>
    </div>
    <div class="learn-radical-hint" id="learn-radical-hint"></div>

</div>

<!-- 피드백 -->
<div class="feedback-ov" id="feedback-ov">
  <div class="fe" id="feedback-fe">◎</div>
</div>

<script>
// ═══════════════════════════════════════
// 부수 정보
// ═══════════════════════════════════════
const RADICAL_INFO = {
  '亻': { name:'にんべん', korean:'사람인변', meaning:'사람·인간', color:'var(--r-ninben)', bg:'rgba(91,143,249,0.12)', border:'rgba(91,143,249,0.3)' },
  '扌': { name:'てへん',   korean:'손수변',   meaning:'손·행동',   color:'var(--r-tehen)', bg:'rgba(249,123,91,0.12)', border:'rgba(249,123,91,0.3)' },
  '言': { name:'ごんべん', korean:'말씀언변', meaning:'말·언어',   color:'var(--r-gonben)', bg:'rgba(165,123,249,0.12)', border:'rgba(165,123,249,0.3)' },
  '忄': { name:'こころ',   korean:'마음심변', meaning:'마음·감정', color:'var(--r-kokoro)', bg:'rgba(249,91,138,0.12)', border:'rgba(249,91,138,0.3)' },
  '氵': { name:'さんずい', korean:'삼수변',   meaning:'물·액체',   color:'var(--r-sanzui)', bg:'rgba(91,200,249,0.12)', border:'rgba(91,200,249,0.3)' },
  '糸': { name:'いとへん', korean:'실사변',   meaning:'실·연결',   color:'var(--r-itoh)', bg:'rgba(91,249,200,0.12)', border:'rgba(91,249,200,0.3)' },
};

// ═══════════════════════════════════════
// 상태
// ═══════════════════════════════════════
let KANJI_DATA = {};
let ALL_KANJI = [];

let G = {
  mode: 'level',
  levelKey: '1',
  questions: [],
  idx: 0,
  score: 0,
  combo: 0,
  maxCombo: 0,
  answers: [],
  timerInterval: null,
  timerLeft: 10,
  animating: false,
};

// ═══════════════════════════════════════
// 데이터 로드
// ═══════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch('kanji.json');
    KANJI_DATA = await res.json();
    // 고유 한자 목록
    const seen = new Set();
    ALL_KANJI = [];
    for (const lv of Object.values(KANJI_DATA.levels)) {
      for (const k of lv.kanji) {
        if (!seen.has(k.char)) { seen.add(k.char); ALL_KANJI.push(k); }
      }
    }
    const el = document.getElementById('word-count');
    if (el && KANJI_DATA.total_words) el.textContent = KANJI_DATA.total_words;
  } catch(e) {
    console.error('kanji.json 로드 실패:', e);
  }
  initHome();
}

// ═══════════════════════════════════════
// 홈 초기화
// ═══════════════════════════════════════
function initHome() {
  // 통계
  const best = localStorage.getItem('bushu3_best');
  if (best) document.getElementById('stat-best').textContent = best + '점';
  const tp = parseInt(localStorage.getItem('bushu3_played') || '0');
  const tc = parseInt(localStorage.getItem('bushu3_correct') || '0');
  document.getElementById('stat-played').textContent = tp;
  document.getElementById('stat-acc').textContent = tp > 0 ? Math.round(tc/tp*100)+'%' : '—';

  // 스트릭
  document.getElementById('streak-num').textContent = getStreak();

  // 데일리
  const today = getTodayKey();
  if (localStorage.getItem('bushu3_daily_'+today) === 'done') {
    document.getElementById('daily-card').classList.add('done');
    document.getElementById('daily-desc').textContent = '오늘 완료 ✓  내일 다시 출제';
  }

  // 오답뱅크
  const bank = getWrongBank();
  document.getElementById('review-count').textContent = bank.length;
  if (bank.length === 0) {
    document.getElementById('review-card').classList.add('empty');
    document.getElementById('review-desc').textContent = '틀린 한자가 없어요 👍';
  } else {
    document.getElementById('review-card').classList.remove('empty');
    document.getElementById('review-desc').textContent = bank.length + '개 한자 복습 대기';
  }

  // 레벨 그리드
  renderLevelGrid();

  // 사운드 버튼
  updateSoundBtns();
}

function renderLevelGrid() {
  if (!KANJI_DATA.levels) return;
  const el = document.getElementById('level-grid');
  const LEVEL_NAMES = {
    '1': '亻 vs 扌', '2': '言 vs 忄', '3': '氵 vs 糸',
    '4': '亻 vs 言', '5': '扌 vs 忄', '6': '氵 vs 言',
  };
  el.innerHTML = Object.entries(KANJI_DATA.levels).map(([lv, data]) => {
    const r = data.radicals.map(r => r.char).join(' vs ');
    const rInfo = RADICAL_INFO[data.radicals[0].char];
    const color = rInfo ? rInfo.color : 'var(--accent)';
    return `<div class="level-card" onclick="startGame('${lv}')" style="border-left-color:${color}">
      <div class="lc-num" style="color:${color}">${lv}</div>
      <div class="lc-info">
        <div class="lc-name" style="font-family:'Noto Serif JP',serif">${r}</div>
        <div class="lc-desc">${data.kanji.length}개 한자 · 부수로 뜻 맞추기</div>
      </div>
      <div class="lc-badge badge-free">FREE</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// 게임 시작
// ═══════════════════════════════════════
function startGame(levelKey) {
  if (!KANJI_DATA.levels) return;
  G.mode = 'level';
  G.levelKey = levelKey;
  const pool = [...KANJI_DATA.levels[levelKey].kanji].sort(() => Math.random() - 0.5);
  setupGame(pool.slice(0, Math.min(12, pool.length)));
}

function startDaily() {
  const today = getTodayKey();
  if (localStorage.getItem('bushu3_daily_'+today) === 'done') {
    alert('오늘 데일리는 이미 완료! 내일 또 만나요 ☀️'); return;
  }
  if (!ALL_KANJI.length) return;
  const seed = today.split('-').reduce((a,b) => a*100+parseInt(b), 0);
  const daily = seededShuffle([...ALL_KANJI], seed).slice(0, 5);
  G.mode = 'daily';
  setupGame(daily);
}

function startReview() {
  const bank = getWrongBank();
  if (!bank.length) { alert('복습할 오답이 없어요!'); return; }
  G.mode = 'review';
  setupGame([...bank].sort(() => Math.random() - 0.5));
}

function retryGame() {
  if (G.mode === 'daily') startDaily();
  else if (G.mode === 'review') startReview();
  else startGame(G.levelKey);
}

function setupGame(pool) {
  // 각 문제: 정답 + 오답 3개
  G.questions = pool.map(correct => {
    const wrongPool = ALL_KANJI.filter(k => k.char !== correct.char && k.meaning !== correct.meaning);
    const wrongs = wrongPool.sort(() => Math.random() - 0.5).slice(0, 3);
    const choices = [...wrongs, correct].sort(() => Math.random() - 0.5);
    return { correct, choices };
  });
  G.idx = 0; G.score = 0; G.combo = 0; G.maxCombo = 0; G.answers = [];
  renderDots();
  showScreen('game');
  renderQuestion();
}

// ═══════════════════════════════════════
// 문제 렌더
// ═══════════════════════════════════════
function renderQuestion() {
  if (G.idx >= G.questions.length) { showResult(); return; }
  const q = G.questions[G.idx];
  const k = q.correct;
  const rInfo = RADICAL_INFO[k.radical] || { name:k.radical, korean:'', meaning:'', color:'var(--accent)', bg:'rgba(201,168,76,0.1)', border:'rgba(201,168,76,0.3)' };

  // 진행
  document.getElementById('g-progress').textContent = `${G.idx+1} / ${G.questions.length}`;
  document.getElementById('g-score').textContent = G.score;

  // 부수 힌트 필
  const pill = document.getElementById('radical-pill');
  pill.style.background = rInfo.bg;
  pill.style.border = `1px solid ${rInfo.border}`;
  document.getElementById('radical-char').textContent = k.radical;
  document.getElementById('radical-char').style.color = rInfo.color;
  document.getElementById('radical-name').textContent = `${rInfo.name} ${rInfo.korean}`;
  document.getElementById('radical-name').style.color = rInfo.color;
  document.getElementById('radical-meaning-hint').textContent = rInfo.meaning + '과 관련된 한자';

  // 한자
  document.getElementById('kanji-char').textContent = k.char;
  document.getElementById('kanji-word').textContent = k.word;
  document.getElementById('kanji-reading').textContent = k.word_reading || '';

  // 선택지
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = q.choices.map((c, i) => `
    <button class="choice-btn" onclick="answer('${c.char}')">
      <span class="choice-num">${i+1}</span>
      ${c.meaning}
    </button>`).join('');

  startTimer();
}

// ═══════════════════════════════════════
// 타이머
// ═══════════════════════════════════════
function startTimer() {
  clearInterval(G.timerInterval);
  G.timerLeft = 10;
  updateTimer();
  G.timerInterval = setInterval(() => {
    G.timerLeft -= 0.1;
    updateTimer();
    if (G.timerLeft <= 0) { clearInterval(G.timerInterval); timeOut(); }
  }, 100);
}

function updateTimer() {
  const pct = (G.timerLeft / 10) * 100;
  const bar = document.getElementById('timer-fill');
  bar.style.width = pct + '%';
  bar.className = 'timer-fill' + (G.timerLeft < 3 ? ' danger' : '');
}

function timeOut() {
  const q = G.questions[G.idx];
  G.combo = 0;
  G.answers.push({ q, answered: null, correct: false });
  updateDot(G.idx, 'wrong');
  playSound('timeout');
  showFeedback('⏱');
  G.idx++;
  setTimeout(() => showLearnCard(q.correct, false), 400);
}

// ═══════════════════════════════════════
// 정답 처리
// ═══════════════════════════════════════
function answer(char) {
  if (G.animating) return;
  clearInterval(G.timerInterval);

  const q = G.questions[G.idx];
  const correct = char === q.correct.char;

  // 버튼 시각화
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    const txt = btn.textContent.trim();
    const btnChar = q.choices.find(c => txt.includes(c.meaning))?.char;
    if (btnChar === q.correct.char) btn.classList.add('correct');
    else if (btnChar === char && !correct) btn.classList.add('wrong');
  });

  if (correct) {
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    const bonus = G.combo >= 3 ? G.combo * 3 : 0;
    const timeBonus = Math.floor(G.timerLeft * 4);
    G.score += 10 + timeBonus + bonus;
    if (G.combo >= 3) playSound('combo');
    else playSound('correct');
    showFeedback('◎');
  } else {
    G.combo = 0;
    playSound('wrong');
    showFeedback('✕');
  }

  G.answers.push({ q, answered: char, correct });
  updateDot(G.idx, correct ? 'correct' : 'wrong');
  G.idx++;
  setTimeout(() => showLearnCard(q.correct, correct), 400);
}

// ═══════════════════════════════════════
// 학습 카드
// ═══════════════════════════════════════
function showLearnCard(k, correct) {
  G.animating = true;
  const rInfo = RADICAL_INFO[k.radical] || { name:k.radical, korean:'', meaning:'', color:'var(--accent)' };

  const sheet = document.getElementById('learn-sheet');
  const inner = document.getElementById('learn-inner');
  const verdict = document.getElementById('learn-verdict');

  if (correct) {
    verdict.className = 'learn-verdict ok';
    verdict.innerHTML = '◎ &nbsp;正解';
    inner.className = 'learn-inner ok-bg';
  } else {
    verdict.className = 'learn-verdict ng';
    verdict.innerHTML = `✕ &nbsp;오답`;
    inner.className = 'learn-inner ng-bg';
  }

  document.getElementById('learn-kanji').textContent = k.char;
  document.getElementById('learn-kanji').style.color = rInfo.color;
  document.getElementById('learn-eq').textContent = `${k.radical}(${rInfo.korean}) ＋ ${k.component} ＝ ${k.char}`;
  document.getElementById('learn-meaning').textContent = k.meaning;
  document.getElementById('learn-reading').textContent = k.word + '  ' + (k.word_reading || '');

  document.getElementById('learn-radical-hint').innerHTML =
    `<strong>${k.radical}</strong>(${rInfo.name})이 들어가면 보통 <strong>${rInfo.meaning}</strong>과 관련돼요`;

  // 같은 부수 한자 2개
  const sameR = ALL_KANJI.filter(x => x.char !== k.char && x.radical === k.radical).slice(0,3);
  document.getElementById('learn-words').innerHTML =
    `<div class="learn-chip">${k.word}<span>${k.word_meaning ? k.word_meaning.slice(0,8) : ''}</span></div>` +
    sameR.map(x => `<div class="learn-chip">${x.char}<span>${x.meaning.slice(0,6)}</span></div>`).join('');

  sheet.classList.add('show');
  const delay = correct ? 1800 : 2400;
  setTimeout(() => {
    sheet.classList.remove('show');
    setTimeout(() => {
      G.animating = false;
      if (G.idx >= G.questions.length) showResult();
      else renderQuestion();
    }, 220);
  }, delay);
}

// ═══════════════════════════════════════
// 결과
// ═══════════════════════════════════════
function showResult() {
  const correctCount = G.answers.filter(a => a.correct).length;
  const total = G.answers.length;
  const wrongs = G.answers.filter(a => !a.correct).map(a => a.q.correct);

  document.getElementById('result-score').textContent = G.score;
  document.getElementById('result-sub').textContent = `${total}문제 · ${correctCount}개 정답`;
  document.getElementById('rs-correct').textContent = correctCount;
  document.getElementById('rs-wrong').textContent = total - correctCount;
  document.getElementById('rs-combo').textContent = G.maxCombo;

  // 기록 저장
  const best = parseInt(localStorage.getItem('bushu3_best') || '0');
  if (G.score > best) localStorage.setItem('bushu3_best', G.score);
  const tp = parseInt(localStorage.getItem('bushu3_played') || '0');
  const tc = parseInt(localStorage.getItem('bushu3_correct') || '0');
  localStorage.setItem('bushu3_played', tp + total);
  localStorage.setItem('bushu3_correct', tc + correctCount);

  if (G.mode === 'daily') {
    localStorage.setItem('bushu3_daily_' + getTodayKey(), 'done');
    updateStreak();
  }

  // 오답뱅크
  if (wrongs.length > 0) addToWrongBank(wrongs);
  if (G.mode === 'review') {
    const correctChars = G.answers.filter(a => a.correct).map(a => a.q.correct.char);
    removeFromWrongBank(correctChars);
  }

  // 사운드
  if (wrongs.length === 0) playSound('perfect');

  // 결과 목록
  document.getElementById('result-list').innerHTML = wrongs.length === 0
    ? `<div style="text-align:center;padding:20px;color:var(--accent);font-family:'Noto Serif JP',serif;font-size:18px;">完璧！ 전부 정답 🎉</div>`
    : G.answers.map(a => {
        const k = a.q.correct;
        const rInfo = RADICAL_INFO[k.radical] || {};
        return `<div class="result-row ${a.correct ? '' : 'r-wrong'}">
          <div class="rr-icon">${a.correct ? '◎' : '✕'}</div>
          <div class="rr-char" style="color:${rInfo.color||'var(--accent)'}">${k.char}</div>
          <div class="rr-info">
            <div class="rr-meaning">${k.meaning}</div>
            <div class="rr-radical">${k.radical} ${rInfo.korean||''} · ${k.word}</div>
          </div>
        </div>`;
      }).join('');

  showScreen('result');
}

// ═══════════════════════════════════════
// 유틸
// ═══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => { s.style.display='none'; s.classList.remove('active'); });
  const el = document.getElementById('screen-'+id);
  el.style.display='flex'; el.classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'home') initHome();
}

function renderDots() {
  document.getElementById('progress-dots').innerHTML =
    G.questions.map((_, i) => `<div class="p-dot" id="dot-${i}"></div>`).join('');
}
function updateDot(i, state) {
  const d = document.getElementById('dot-'+i);
  if (d) d.className = 'p-dot ' + state;
}

function showFeedback(emoji) {
  const ov = document.getElementById('feedback-ov');
  document.getElementById('feedback-fe').textContent = emoji;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 600);
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function getStreak() { return parseInt(localStorage.getItem('bushu3_streak') || '0'); }
function updateStreak() {
  const today = getTodayKey();
  const last = localStorage.getItem('bushu3_last_daily');
  const yest = (() => { const d = new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; })();
  let s = getStreak();
  if (last === yest) s++; else if (last !== today) s = 1;
  localStorage.setItem('bushu3_streak', s);
  localStorage.setItem('bushu3_last_daily', today);
}
function getWrongBank() { try { return JSON.parse(localStorage.getItem('bushu3_wrongs') || '[]'); } catch { return []; } }
function saveWrongBank(b) { localStorage.setItem('bushu3_wrongs', JSON.stringify(b)); }
function addToWrongBank(items) {
  let b = getWrongBank();
  items.forEach(k => { if (!b.find(x => x.char === k.char)) b.push(k); });
  if (b.length > 40) b = b.slice(-40);
  saveWrongBank(b);
}
function removeFromWrongBank(chars) { saveWrongBank(getWrongBank().filter(k => !chars.includes(k.char))); }
function seededShuffle(arr, seed) {
  const a = [...arr]; let s = seed;
  for (let i = a.length-1; i > 0; i--) {
    s = (s*9301+49297)%233280;
    const j = Math.floor((s/233280)*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ═══════════════════════════════════════
// 사운드
// ═══════════════════════════════════════
let audioCtx = null;
let soundOn = localStorage.getItem('bushu3_sound') !== 'off';

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {

    const ctx = getCtx(); const t = ctx.currentTime;

      [523,784].forEach((f,i) => { const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='sine';o.frequency.value=f; g.gain.setValueAtTime(0.22,t+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.2); o.start(t+i*0.1);o.stop(t+i*0.1+0.2); });
    } else if (type === 'wrong') {
      const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+0.25); g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25); o.start(t);o.stop(t+0.25);
    } else if (type === 'combo') {
      [523,659,880].forEach((f,i) => { const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='sine';o.frequency.value=f; g.gain.setValueAtTime(0.2,t+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.18); o.start(t+i*0.08);o.stop(t+i*0.08+0.18); });
    } else if (type === 'timeout') {
      const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(150,t+0.4); g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t);o.stop(t+0.4);
    } else if (type === 'perfect') {
      [523,659,784,1047].forEach((f,i) => { const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='sine';o.frequency.value=f; g.gain.setValueAtTime(0.2,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.25); o.start(t+i*0.12);o.stop(t+i*0.12+0.25); });
    }
  } catch(e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('bushu3_sound', soundOn ? 'on' : 'off');
  updateSoundBtns();
  if (soundOn) playSound('correct');
}
function updateSoundBtns() {
  const label = soundOn ? '🔊 SOUND ON' : '🔇 SOUND OFF';
  const hBtn = document.getElementById('sound-btn-home');
  const gBtn = document.getElementById('sound-btn-game');
  if (hBtn) hBtn.textContent = label;
  if (gBtn) gBtn.textContent = soundOn ? '🔊' : '🔇';
}

// 시작
loadData();
</script>
</body>
